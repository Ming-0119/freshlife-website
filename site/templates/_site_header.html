<a class="skip-link" href="#main">{{skip_text}}</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="{{home_href}}#top" aria-label="{{brand_aria}}">
      <img src="/app-icon.png" alt="" width="30" height="30"/>
      <span>FreshLife</span>
    </a>
    <nav class="nav-links" aria-label="{{nav_aria}}">
      {{nav}}
    </nav>
    {{lang_switch}}
    {{theme_toggle}}
    <a class="nav-cta" href="{{nav_cta_href}}">{{nav_cta_label}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5"/></svg></a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="mobile-nav" aria-label="{{toggle_aria}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>

<nav class="mobile-nav" id="mobile-nav" aria-label="{{mobile_nav_aria}}">
  {{nav_mobile}}
  {{lang_switch_mobile}}
  {{theme_toggle_mobile}}
</nav>
