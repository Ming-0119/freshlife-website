{{head}}
<a class="skip-link" href="#main">{{skip_text}}</a>
<div class="legal-shell">
  <nav class="legal-nav" aria-label="{{nav_aria}}">
    <a class="brand" href="{{home_href}}"><img src="/app-icon.png" alt="" width="30" height="30"/><span>FreshLife</span></a>
    <div class="legal-nav-right">
      {{lang_switch}}
      {{theme_toggle}}
      <a class="back" href="{{home_href}}">{{back_text}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M10 17l-5-5 5-5"/></svg></a>
    </div>
  </nav>
  <main id="main">
    <article class="legal-page">
      {{content}}
    </article>
  </main>
  <footer class="site-footer" style="margin-top:0">
    <div class="container">
      <div class="footer-bottom" style="margin-top:0;border-top:0;justify-content:center">
        <span>© <span data-year>{{year}}</span> FreshLife · {{developer_line}} · {{footer_links}}</span>
      </div>
    </div>
  </footer>
</div>
{{js}}
</body>
</html>
