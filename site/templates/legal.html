{{head}}
<a class="skip-link" href="#main">跳到主要内容</a>
<div class="legal-shell">
  <nav class="legal-nav" aria-label="页面导航">
    <a class="brand" href="/"><img src="/app-icon.png" alt="" width="30" height="30"/><span>FreshLife</span></a>
    <div class="legal-nav-right">
      {{theme_toggle}}
      <a class="back" href="/">返回首页<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M10 17l-5-5 5-5"/></svg></a>
    </div>
  </nav>
  <main id="main">
    <article class="legal-page">
      {{content}}
    </article>
  </main>
  <footer class="site-footer" style="margin-top:0">
    <div class="container">
      <div class="footer-bottom" style="margin-top:0;border-top:0;justify-content:center">
        <span>© <span data-year>{{year}}</span> FreshLife · 开发者与运营者：{{developer}} · <a href="/sitemap.xml">站点地图</a></span>
      </div>
    </div>
  </footer>
</div>

</body>
</html>
