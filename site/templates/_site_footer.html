<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <b><img src="/app-icon.png" alt="" width="26" height="26"/>FreshLife</b>
        <p>{{footer_tagline}}</p>
      </div>
      <div class="footer-col">
        <h4>{{col_product}}</h4>
        {{footer_product}}
      </div>
      <div class="footer-col">
        <h4>{{col_support}}</h4>
        {{footer_legal}}
      </div>
      <div class="footer-col">
        <h4>{{col_status}}</h4>
        <a href="{{status_launch_href}}">{{status_launch}}</a>
        <a href="{{status_features_href}}">{{status_features}}</a>
        <a href="{{status_roadmap_href}}">{{status_roadmap}}</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span class="footer-owner">© <span data-year>{{year}}</span> FreshLife · {{developer_line}}</span>
      <nav class="footer-utility" aria-label="{{footer_utility_aria}}">
        <a href="{{footer_language_href}}" hreflang="{{footer_language_hreflang}}" lang="{{footer_language_hreflang}}">{{footer_language_label}}</a>
        <a href="{{safety_href}}">{{safety_label}}</a>
      </nav>
    </div>
  </div>
</footer>

{{js}}
<script type="module" src="/app/accessibility.mjs"></script>
</body>
</html>
