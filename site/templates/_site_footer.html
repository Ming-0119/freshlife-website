<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <b><img src="/app-icon.png" alt="" width="26" height="26"/>FreshLife</b>
        <p>{{footer_tagline}}</p>
      </div>
      <div class="footer-col">
        <h4>{{col_product}}</h4>
        {{footer_product}}
      </div>
      <div class="footer-col">
        <h4>{{col_support}}</h4>
        {{footer_legal}}
      </div>
      <div class="footer-col">
        <h4>{{col_status}}</h4>
        <a href="{{status_launch_href}}">{{status_launch}}</a>
        <a href="{{status_features_href}}">{{status_features}}</a>
        <a href="{{status_roadmap_href}}">{{status_roadmap}}</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© <span data-year>{{year}}</span> FreshLife · {{developer_line}}</span>
      <span>{{lang_line}} · <a href="/sitemap.xml">{{sitemap_label}}</a></span>
    </div>
  </div>
</footer>

{{js}}
</body>
</html>
